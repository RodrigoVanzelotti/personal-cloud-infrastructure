# Imported snapshot; keep disabled until source deployment ownership and Hosting configuration are migrated.
environment: stage
enabled: false
gcp:
  project_id: fundocentenario-website-stg
  region: southamerica-east1
state_bucket: fundocentenario-website-stg-tfstate
deployments:
  api:
    service_name: fundo-centenario
    image: southamerica-east1-docker.pkg.dev/fundocentenario-website-stg/fundo-images/fundo@sha256:8e653eb01033fe58697facedf9f42d1c9721574065dcad1b957051c517118730
    service_account: fundo-runtime@fundocentenario-website-stg.iam.gserviceaccount.com
    public: false
    invoker_iam_disabled: true
    ingress: INGRESS_TRAFFIC_ALL
    port: 8000
    cpu: '1'
    memory: 512Mi
    timeout_seconds: 180
    max_concurrency: 20
    cpu_idle: true
    startup_cpu_boost: true
    service_scaling:
      max_instances: 20
    startup_probe:
      failure_threshold: 12
      period_seconds: 10
      timeout_seconds: 2
      http_get:
        path: /api/health
        port: 8000
    env:
      APP_ENV: staging
      STORAGE_BACKEND: firestore
      SERVE_FRONTEND: 'false'
      GOOGLE_CLOUD_PROJECT: fundocentenario-website-stg
      FIRESTORE_DATABASE: (default)
      FIRESTORE_PREFIX: fundo_
      PYTHON_DOTENV_DISABLED: '1'
      STRIPE_API_VERSION: 2026-10-28.endive
      PUBLIC_BASE_URL: https://fundocentenario-website-stg.web.app
      CORS_ORIGINS: https://fundocentenario-website-stg.web.app
      EMAIL_ENABLED: 'true'
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '587'
      SMTP_SECURITY: starttls
      EMAIL_FROM_ADDRESS: rodrigo.vanzelotti@fundocentenario.com.br
      SCHEDULER_AUDIENCE: https://fundo-centenario-wouc4s5bsa-rj.a.run.app
      SCHEDULER_SERVICE_ACCOUNT: fundo-scheduler@fundocentenario-website-stg.iam.gserviceaccount.com
      INTENT_LIMIT_PER_MINUTE: '60'
      EMAIL_BATCH_SIZE: '10'
      EMAIL_REPLY_TO: ''
    secret_env:
      STRIPE_SECRET_KEY:
        secret: stripe-secret-key
        version: '1'
      STRIPE_WEBHOOK_SECRET:
        secret: stripe-webhook-secret
        version: '1'
      SMTP_USERNAME:
        secret: smtp-username
        version: '2'
      SMTP_PASSWORD:
        secret: smtp-password
        version: '2'
    scaling:
      min_instances: 0
      max_instances: 3
    traffic:
    - type: TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION
      revision: fundo-centenario-00006-pih
      percent: 100
    - type: TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION
      revision: fundo-centenario-00006-pih
      tag: candidate
    client: gcloud
    client_version: 591.0.0
    revision: fundo-centenario-00006-pih
  frontend:
    site_id: fundocentenario-website-stg
    commit: 52964bd4f6c6f74192dfa80016dbc6e685a5c05b
    public_dir: frontend
artifact_registry:
- fundo-images
